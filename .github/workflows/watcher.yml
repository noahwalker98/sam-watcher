name: SAM.gov watcher

on:
  schedule:
    # Times are Central while daylight saving is on. After November 1 2026 they
    # all shift an hour earlier, so change 13 to 14 and 21 to 22 that week.
    #
    # Never schedule on the hour, or on :15, :30 or :45. GitHub queues scheduled
    # runs and drops them under load, and those are the slots everyone else uses.
    - cron: '23 13 * * *'   # 8:23am Central, primary
    - cron: '53 13 * * *'   # 8:53am Central, backup
    - cron: '23 21 * * *'   # 4:23pm Central, primary
    - cron: '53 21 * * *'   # 4:53pm Central, backup
    # TEMPORARY smoke tests, 22 Sep 2026. Three scheduled runs were dropped while
    # this repository was private. These two prove whether making it public fixed
    # the scheduler. They send nothing, see the guard step. DELETE BOTH once the
    # question is answered, along with the matching clause below.
    - cron: '38 23 * * *'
    - cron: '48 23 * * *'
  workflow_dispatch:
    inputs:
      send_to_all:
        description: 'Send to the full list. Leave OFF for test runs, which go to the sending account only.'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The backup run exists only in case GitHub drops the primary. If a primary
      # already sent this slot, or is still sending it, this exits without
      # emailing, so nobody ever gets the report twice. Manual runs always send.
      #
      # This check FAILS OPEN on purpose. If the lookup breaks, we send. A guard
      # that can silently stop the report is worse than an occasional duplicate.
      - name: Skip if a run already sent recently
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          case "${{ github.event.schedule }}" in
            "38 23 * * *"|"48 23 * * *")
              echo "Scheduler smoke test. The run existing at all is the result. Not sending."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          if [ "${{ github.event_name }}" = "schedule" ]; then
            cutoff=$(date -u -d '90 minutes ago' +%Y-%m-%dT%H:%M:%SZ)
            count=$(gh run list --workflow watcher.yml --limit 20 --json databaseId,createdAt,status,conclusion --jq "[.[] | select(.databaseId != ${{ github.run_id }}) | select(.createdAt > \"$cutoff\") | select(.conclusion == \"success\" or .status == \"in_progress\" or .status == \"queued\")] | length") || count=""
            if [ -z "$count" ]; then
              echo "Guard lookup failed. Sending anyway, a missed report beats a duplicate."
            elif [ "$count" -gt 0 ]; then
              echo "$count run(s) already sent or sending since $cutoff. Skipping."
              skip=true
            else
              echo "Nothing sent since $cutoff. Sending."
            fi
          else
            echo "Manual run. Sending."
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: '3.12'

      # Scheduled runs go to the full list. A manual run goes to the sending
      # account only unless send_to_all was ticked, so a test never reaches
      # the wider distribution list by accident.
      - name: Fetch SAM.gov and email the report
        if: steps.guard.outputs.skip != 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENTS: ${{ (github.event_name != 'workflow_dispatch' || inputs.send_to_all) && secrets.RECIPIENTS || secrets.GMAIL_ADDRESS }}
        run: python watcher.py
